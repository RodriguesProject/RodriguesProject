name: Validar portfólio
on:
  push:
    branches: [main]
    paths: ["projects/**", ".github/workflows/portfolio-validation.yml"]
  pull_request:
    branches: [main]
    paths: ["projects/**", ".github/workflows/portfolio-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-projetos-python:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependências
        run: python -m pip install -r projects/01-analise-varejo-python-sql/requirements.txt
      - name: Executar análise de varejo
        run: python projects/01-analise-varejo-python-sql/src/analise_vendas.py
      - name: Executar Legal Operations Analytics
        run: python projects/02-legal-operations-analytics/src/analise_legal_ops.py
      - name: Executar automação de triagem
        run: python projects/04-automacao-triagem-juridica/src/triagem.py
      - name: Testar automação e qualidade das bases
        run: |
          python -m unittest discover -s projects/04-automacao-triagem-juridica/tests -p "test_triagem.py" -v
          python -m unittest discover -s projects/04-automacao-triagem-juridica/tests -p "test_data_quality.py" -v
          test -s projects/01-analise-varejo-python-sql/outputs/indicadores_gerais.csv
          test -s projects/01-analise-varejo-python-sql/outputs/receita_mensal.png
          test -s projects/02-legal-operations-analytics/outputs/indicadores_gerais.csv
          test -s projects/02-legal-operations-analytics/outputs/demandas_por_area.png
          test -s projects/04-automacao-triagem-juridica/outputs/indicadores_triagem.csv
